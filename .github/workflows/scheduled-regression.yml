name: Scheduled & On-Demand Regression Suite

on:
  schedule:
    # Run every weekday at midnight UTC
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
    inputs:
      parallel:
        description: "Run tests in parallel with pytest-xdist"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      workers:
        description: "Number of workers if parallel (default: auto)"
        required: false
        default: "auto"

jobs:
  regression-suite:
    name: API Regression Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-Flight Health Check
        run: |
          python scripts/check_environment.py

      - name: Run Sequential Regression
        if: ${{ github.event.inputs.parallel != 'true' }}
        run: |
          python scripts/run_regression.py

      - name: Run Parallel Regression
        if: ${{ github.event.inputs.parallel == 'true' }}
        run: |
          python scripts/run_regression.py --parallel --workers ${{ github.event.inputs.workers }}

      - name: Upload Regression Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-execution-reports
          path: reports/
