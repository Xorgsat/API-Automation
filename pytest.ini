[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --durations=10
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: Quick health check and availability tests
    functional: Functional CRUD tests and business logic
    authentication: Authentication token generation and credentials validation
    security: Authorization enforcement and security checks
    negative: Negative payloads, error handling, and invalid inputs
    boundary: Boundary value analysis (extremes, types, limits)
    contract: JSON Schema and API contract validation
    idempotency: HTTP verb semantics and idempotency checks
    concurrency: Multi-threaded and parallel operation tests
    performance: Lightweight latency and response time measurements
